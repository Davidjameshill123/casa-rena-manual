<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Casa Rena Guest Manual</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: 'Georgia', serif;
      color: #111;
      background: url('tiled_background_rotated.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
    }
    .content {
      background-color: rgba(255, 255, 255, 0.96);
      padding: 40px;
      margin: 0 auto;
      max-width: 1000px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    h1 {
      font-size: 2.8em;
      text-align: center;
      color: #3e312e;
      margin-bottom: 1em;
    }
    ul {
      margin-left: 1.5em;
      margin-bottom: 1em;
    }
    li {
      margin-bottom: 0.5em;
    }
    p {
      margin-bottom: 1em;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <script>
    var password = prompt("Enter password to view Casa Rena manual:");
    if (!password || password.trim() !== "casarena2025") {
      document.write("<h1 style='text-align:center;'>🚫 Access Denied</h1>");
    } else {
      document.write(`

      <div class="content">
        <h1>🏡 Welcome to Casa Rena!</h1>

        <p>Sunshine? Check. Sangria? Double check. Everything else you need to know? Right here—simple, breezy, and just the right amount of bossy.</p>

        <h2>🔑 Getting In</h2>
        <ul>
          <li>Side gate key: on the inside left edge of the gate, in a plastic housing. Flick off the cap, use the key, reseal it after.</li>
          <li>Main key: go up the side stairs to the roof terrace. Look behind the rear post of the wooden bedframe.</li>
          <li>Lockbox code: 1684</li>
          <li>Inside: front door key + safe key (safe is in main bedroom wardrobe)</li>
        </ul>

        <h2>🚨 Disarming the Alarm</h2>
        <ul>
          <li>Open the front door (pull and turn key anti-clockwise).</li>
          <li>Alarm will beep — go inside and reach on top of the extractor fan (nearest the hob).</li>
          <li>Grab the round white/silver fob and tap it to the alarm panel.</li>
          <li>Return fob and key to hiding spots.</li>
        </ul>

        <h2>🧷 Keys Inside (by the TV)</h2>
        <ul>
          <li>Electric gate fob</li>
          <li>Security fob</li>
          <li>Side gate (peach polish)</li>
          <li>Front gate (pink polish) — use this only when leaving finally</li>
          <li>Pool cupboard (blue polish)</li>
        </ul>

        <h2>🏠 While You’re In</h2>
        <ul>
          <li>Kitchen bifold: open single door first, then fold remaining panels</li>
          <li>Rear sliding doors: unbolt and press latches to unlock. Exit from terrace only.</li>
          <li>Bedroom windows can stay open — they aren’t connected to the alarm</li>
        </ul>

        <h2>🍷 Wine Fridge</h2>
        <ul>
          <li>Switch is on top inside panel</li>
          <li>Enjoy anything inside — just replace like for like</li>
        </ul>

        <h2>👋 Leaving (Short Trip or Final Checkout)</h2>
        <ul>
          <li>Alarm: press the “house + person outside” icon</li>
          <li>Wait for beeps, shut the door — it locks itself</li>
          <li>Pull and turn key clockwise for extra lock</li>
        </ul>

        <h2>🧼 Departure Cleaning Checklist</h2>
        <ul>
          <li>Toaster: empty crumbs + clean grills</li>
          <li>Dishwasher: empty and clean (no metal left inside)</li>
          <li>Use eco-speedy wash: 42 min (running plate icon + eco light)</li>
          <li>Check and clean the dishwasher filter and silver disc at bottom</li>
          <li>Fridge: remove anything expiring, wipe shelves, label jars</li>
          <li>Coffee: run Nespresso without pod. Do NOT pour coffee grounds in sink</li>
          <li>Bins: tie and take to main road every 2 days minimum. Keep lid sealed</li>
          <li>Bleach sinks and toilets before leaving</li>
          <li>Laundry: wash bedding/towels if time. Otherwise, leave dry in basket</li>
          <li>Leave washer door open, wipe rubber seal, and drawer (if used)</li>
        </ul>

        <h2>⚡ Electricity Tips</h2>
        <p>There are 3 tariffs:</p>
        <ul>
          <li>💤 Off Peak: Midnight–8am</li>
          <li>😌 Mid Peak: 8–10am, 2–6pm, 10–Midnight</li>
          <li>🔥 Peak: 10am–2pm, 6–10pm</li>
        </ul>
        <ul>
          <li>Run hot cycles at night using delay timer</li>
          <li>Use cold washes any time</li>
        </ul>

        <h2>🏊 Pool</h2>
        <ul>
          <li>Use the skimming net (on the wall) — show off your Baywatch skills</li>
          <li>⚠️ Do not touch the pool controls</li>
          <li>Russell the Pool Guy can help for €20</li>
          <li>Tiles are slippery — walk carefully</li>
        </ul>

      </div>
      `);
    }
  </script>
</body>
</html>
