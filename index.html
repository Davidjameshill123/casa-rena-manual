<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Casa Rena Guest Manual</title>
  <script>
    var password = prompt("Enter password to view Casa Rena manual:");
    if (!password || password.trim() !== "casarena2025") {
      document.write("<style>body{background:#000;color:#fff;}</style><h1 style='text-align:center;margin-top:25vh;'>🚫 Access Denied</h1>");
    } else {
      document.write(`
        <style>
          body {
            margin: 0;
            padding: 40px;
            font-family: 'Georgia', serif;
            color: #111;
            background: url('tiled_background_rotated.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
          }
          .content {
            background-color: rgba(255, 255, 255, 0.96);
            padding: 40px;
            margin: 0 auto;
            max-width: 1000px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
          }
          h1 {
            font-size: 2.8em;
            text-align: center;
            color: #3e312e;
            margin-bottom: 1em;
          }
          ul {
            margin-left: 1.5em;
            margin-bottom: 1em;
          }
          li {
            margin-bottom: 0.5em;
          }
          p {
            margin-bottom: 1em;
            line-height: 1.6;
          }
        </style>
        <body>
          <div class="content">
            <h1>🏡 Welcome to Casa Rena!</h1>
            <p>Sunshine? Check. Sangria? Double check. Everything else you need to know? Right here—simple, breezy, and just the right amount of bossy.</p>

            <h2>🔑 Getting In</h2>
            <ul>
              <li>Side Gate Key: Look at the inside left edge of the side gate—there’s a slim plastic housing. Flick off the cap, grab the key, unlock the gate, then put it back and reseal the cap.</li>
              <li>Main Door Access Key (via Roof Terrace): Go up the side stairs to the roof terrace. Find the wooden four-poster bed frame. The lockbox is on the back side of the rear upright post, closest to the back wall. Lockbox code: 1684</li>
              <li>Inside the lockbox: Unmarked front door key and Safe key (safe in main bedroom wardrobe)</li>
            </ul>

            <h2>🚨 Alarm System</h2>
            <ul>
              <li>Open front door by turning key anti-clockwise and pulling the door toward you. Alarm starts beeping.</li>
              <li>Reach on top of extractor fan above the stove and grab the round flower-shaped fob.</li>
              <li>Tap fob to alarm panel near the door to silence it. Return fob and key to hiding spots.</li>
            </ul>

            <h2>🧷 Keys (Inside House)</h2>
            <ul>
              <li>Located by the TV</li>
              <li>Includes: Electric gate fob, Security fob, Side gate key (peach polish), Front gate (pink polish), Pool cupboard (blue polish)</li>
            </ul>

            <h2>🏠 While You’re In</h2>
            <ul>
              <li>Kitchen Bi-fold Doors: Fully open the single door, then fold the rest to the wall.</li>
              <li>Rear Sliding Doors: Press latches, unscrew bolt. This door does not open from the rear.</li>
              <li>Bedroom Windows: Let the breeze in! You can leave them open when going out—they’re not connected to the alarm system.</li>
              <li>Front Bedroom Window: Turn the handle clockwise 6–12 to open, 12–6 to lock.</li>
            </ul>

            <h2>🍷 Wine Fridge</h2>
            <ul>
              <li>Switch is on the top inside panel.</li>
              <li>All wine, beer, and food may be used and replaced like-for-like.</li>
            </ul>

            <h2>👋 When You're Leaving</h2>
            <ul>
              <li>Set the alarm by pressing the icon of a house with a person outside.</li>
              <li>It will beep—shut the door and pull it toward you. It locks automatically.</li>
              <li>Turn the key clockwise for extra security.</li>
              <li>Leave bedroom doors wide open.</li>
            </ul>

            <h2>🧼 Cleaning & Departure Checklist</h2>
            <ul>
              <li>Toaster: Empty crumbs, clean racks.</li>
              <li>Dishwasher: Don’t leave dishes. Remove metal items immediately. Use eco-speedy wash (42 mins).</li>
              <li>Fridge: Wipe shelves, throw out expiring food. Label jars with open dates. No bread left behind.</li>
              <li>Coffee: Run once without pod. Don’t pour grounds down the sink or into the dishwasher.</li>
              <li>Bins: Empty regularly. Keep lids sealed. Take to communal bins every 2 days minimum (main road, across the street). Recycling to the left.</li>
              <li>Laundry: Wash bedding/towels if time allows. Otherwise, leave dry in basket.</li>
              <li>Wipe surfaces, clean with insect floor wash. Pour bleach into sinks and toilets.</li>
            </ul>

            <h2>⚡ Electricity Usage Tips</h2>
            <ul>
              <li>💤 Off Peak: Midnight–8am</li>
              <li>😌 Mid Peak: 8–10am, 2–6pm, 10–Midnight</li>
              <li>🔥 Peak: 10–2, 6–10pm</li>
              <li>Use delay start for hot cycles after midnight. Cold cycles anytime.</li>
            </ul>

            <h2>🏊 Pool Care</h2>
            <ul>
              <li>Skim pool using the net. DO NOT touch pool controls.</li>
              <li>Russell the Pool Guy can do it for €20</li>
              <li>Tiles are slippery—walk carefully!</li>
            </ul>
          </div>
        </body>
      `);
    }
  </script>
</head>
</html>
